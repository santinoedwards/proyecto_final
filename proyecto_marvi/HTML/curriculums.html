<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículums - Marvi</title>

    <link rel="stylesheet" href="../CSS/index.css">
    <link rel="stylesheet" href="../CSS/acciones-admin.css">
    <script src="../JS/curriculums.js" defer></script>
</head>
<body>

<header>
    <a href="../HTML/index.html" aria-label="Volver al inicio de Marvi">
        <img id="logo" src="../imagenes/logo.png" alt="Logo de Marvi">
    </a>

    <nav>
        <a href="../HTML/adminstrador.html">administrador</a>
        <a href="../HTML/index.html">Inicio</a>
        <a href="../HTML/empleos.html">Empleos</a>
        <a href="../HTML/beneficios.html">Beneficios</a>
        <a href="../HTML/postularse.html">Postularse</a>
    </nav>
</header>

    <main class="seccion-admin">
        <div class="admin-panel-heading">
            <div>
                <h1>Postulaciones recibidas</h1>
                <p>Aquí puedes revisar los datos y currículums enviados.</p>
            </div>
            <button type="button" class="btn-cerrar-sesion" id="logout-button">Cerrar sesión</button>
        </div>

        <p class="admin-message" id="tabla-message" role="status" aria-live="polite"></p>

        <div class="tabla-contenedor">
            <table class="tabla-cvs">
                <thead>
                    <tr>
                        <th scope="col">Postulante</th>
                        <th scope="col">Email</th>
                        <th scope="col">Teléfono</th>
                        <th scope="col">Puesto</th>
                        <th scope="col">Carta de presentación</th>
                        <th scope="col">CV adjunto</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo-cvs">
                    <tr>
                        <td colspan="8" class="tabla-vacia">Cargando postulaciones...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
