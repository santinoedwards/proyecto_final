<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iniciar sesión - Marvi</title>

	<link rel="stylesheet" href="../CSS/index.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="login-page">

<header>
	<a href="../HTML/index.html" aria-label="Volver al inicio de Marvi">
		<img id="logo" src="../imagenes/logo.png" alt="Logo de Marvi">
	</a>

	<nav>
		<a href="../HTML/index.html">Inicio</a>
		<a href="../HTML/empleos.html">Empleos</a>
		<a href="../HTML/beneficios.html">Beneficios</a>
		<a href="../HTML/postularse.html">Postularse</a>
	</nav>
</header>

<main class="login-section">

	<div class="login-card">

		<div class="login-header">
			<h1>Iniciar sesión</h1>
			<p>
				Accedé al panel para gestionar las postulaciones.
			</p>
		</div>

		<form class="login-form" method="POST" action="#">

			<div class="login-field">
				<label for="email">Correo electrónico</label>
				<input
					type="email"
					id="email"
					name="email"
					autocomplete="username"
					placeholder="tu correo@ejemplo.com"
					required
				>
			</div>

			<div class="login-field">
				<label for="password">Contraseña</label>
				<input
					type="password"
					id="password"
					name="password"
					autocomplete="current-password"
					placeholder="Ingresá tu contraseña"
					required
				>
			</div>

			<button type="submit">
				Iniciar sesión
			</button>

		</form>

	</div>

</main>

</body>
</html>
